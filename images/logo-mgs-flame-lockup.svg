  <desc id="logoDesc">Half blue, half red flame icon with Morecambe Gas over Services text.</desc>
  <defs>
    <style>
      .wordmarkTop { font: 700 68px "Barlow Condensed", Arial, sans-serif; fill: #0B1F3B; letter-spacing: 1px; }
      .wordmarkBottom { font: 700 52px "Barlow Condensed", Arial, sans-serif; fill: #0B1F3B; letter-spacing: 1px; }
